name: Release APK

# Baut die optimierte Release-APK, führt die Tests aus und hängt tractive-watch.apk an das
# Release "v<versionName>" (aus app/build.gradle.kts). Tag + Release werden
# vom Workflow selbst angelegt — ausgelöst, wenn sich RELEASE_NOTES.md ändert,
# oder manuell.
on:
  push:
    paths: ["RELEASE_NOTES.md", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Android SDK ist auf ubuntu-latest vorinstalliert (ANDROID_HOME);
      # android-actions/setup-android@v3 scheitert dort ("Failed to find package 'tools'").

      - name: Build + Tests
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testDebugUnitTest --console=plain

      - name: APK benennen
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/tractive-watch.apk

      - name: Version lesen
        id: ver
        run: echo "name=v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.name }}
          body_path: RELEASE_NOTES.md
          # Optimierter R8-Build (deutlich flüssiger als Debug), feste Signatur
          files: app/build/outputs/apk/release/tractive-watch.apk
